<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quérix · Prototype</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#14263d;background:#edf4fa}header{background:#062b59;color:white;padding:18px;display:flex;align-items:center;gap:12px}header img{width:42px}main{padding:24px;max-width:900px;margin:auto;padding-bottom:100px}nav{position:fixed;bottom:0;background:#062b59;width:100%;display:flex;justify-content:space-around;padding:12px 0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px;background:#1648d8;color:white}nav button{background:transparent;font-size:12px}nav button[aria-current=true]{background:#1648d8}article{background:white;border:1px solid #d5e2ef;border-radius:14px;padding:20px;margin:12px 0}input{width:100%;padding:14px;border:1px solid #8296aa;border-radius:10px;font:inherit}small{color:#34536d}.scene{min-height:220px;background:#c9dce9;display:grid;place-items:center;border-radius:12px}button:focus-visible{outline:3px solid #00a6b5;outline-offset:3px}@media(min-width:850px){nav{width:190px;top:78px;flex-direction:column;justify-content:flex-start;gap:12px;padding:16px}main{margin-left:190px;padding:40px}.hybrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}}</style><header><img src="../assets/brand/querix-icon.svg" alt=""><strong>Quérix</strong><span>Prototype</span></header><nav id="nav"></nav><main id="main"></main><script>const tabs=['Accueil','Protocoles','Jeu 3D','Répertoire','Profil'];let page=0;const views=[()=>'<small>ESPACE PROFESSIONNEL</small><h1>Comment pouvons-nous vous aider?</h1><input placeholder="Rechercher un protocole" aria-label="Rechercher" oninput="search(this.value)"><div id="results"></div><article><h2>Protocoles interactifs</h2><p>Consulter un parcours guidé.</p><button onclick="show(1)">Consulter</button></article><article><h2>Formation immersive</h2><p>Pratiquer avec des situations fictives.</p><button onclick="show(2)">Commencer</button></article>',()=>'<h1>Protocoles</h1><input placeholder="Rechercher" aria-label="Rechercher" oninput="search(this.value)"><div id="results"></div>'+['Vaccination','Dépistage','Prélèvements'].map(x=>'<article><h2>'+x+'</h2><button onclick="question()">Ouvrir la démonstration</button></article>').join(''),()=>'<h1>Jeu 3D</h1><article><h2>Scénario de démonstration</h2><p>Environnement fictif</p><button onclick="hybrid()">Mode hybride</button> <button onclick="immersive()">Mode immersif</button></article>',()=>'<h1>Répertoire</h1><input aria-label="Rechercher un établissement" placeholder="Rechercher un établissement"><article>Fiche de démonstration · aucune coordonnée réelle</article>',()=>'<h1>Profil</h1><article><h2>Progression</h2><p>Aucune session enregistrée</p></article><article><h2>Accessibilité</h2><label><input style="width:auto" type="checkbox"> Réduire les animations</label></article>'];function show(i){page=i;document.getElementById('nav').innerHTML=tabs.map((t,j)=>'<button aria-current="'+(i===j)+'" onclick="show('+j+')">'+t+'</button>').join('');document.getElementById('main').innerHTML=views[i]()}function search(v){document.getElementById('results').textContent=v?'Recherche de démonstration : '+v:''}function question(){document.getElementById('main').innerHTML='<small>CAS FICTIF · 1/1</small><h1>Les informations nécessaires sont-elles disponibles?</h1><article><button onclick="verdict(true)">Oui</button> <button onclick="verdict(false)">Non</button></article><button onclick="show(1)">Retour</button>'}function verdict(ok){document.getElementById('main').innerHTML='<h1>'+(ok?'DONE · Démonstration terminée':'HOLD · Vérification nécessaire')+'</h1><article>Résultat fictif, sans décision clinique.</article><button onclick="show(1)">Retour aux protocoles</button>'}function hybrid(){document.getElementById('main').innerHTML='<h1>Mode hybride</h1><div class="hybrid"><article>Questionnaire de formation<p>Scénario fictif</p><button onclick="verdict(true)">Terminer</button></article><div class="scene">Emplacement du moteur 3D</div></div>'}function immersive(){document.getElementById('main').innerHTML='<h1>Mode immersif</h1><div class="scene">Emplacement du moteur 3D</div><button onclick="show(2)">Quitter</button>'}show(0)</script></html>
