name: Deploy Querix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          QUERIX_PAGES: '1'
          NEXT_PUBLIC_BASE_PATH: /querix
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
